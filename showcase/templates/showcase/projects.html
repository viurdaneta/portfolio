{% extends 'showcase/base.html' %}
{% load static %}

{% block title %}Projects{% endblock %}

{% block content %}

<section class="section has-background-grey-darker">
  <div class="container">
    <h1 class="title has-text-primary-light has-text-centered mb-6">
      My Projects
    </h1>

    <div class="columns is-multiline">
      {% for project in projects %}
        <div class="column is-one-third">
          <div class="card">

            <div class="card-content">
              <p class="title is-5">{{ project.title }}</p>
              <p class="subtitle is-6 has-text-grey">{{ project.tools }}</p>

              <div class="content">
                {{ project.description }}
              </div>

              <div class="buttons">
                <a href="{% url 'project_overview' project.slug %}"
                   class="button is-rounded has-text-light"
                   style="background-color: #2f2f2f;">
                  View project
                </a>
              </div>

            </div>
          </div>
        </div>
      {% endfor %}
    </div>
  </div>
</section>

{% endblock %}
